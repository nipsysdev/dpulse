# Test dpulse.yml with multiple environments

timeout: 5000
environment: dev
feedUrl: "https://test.example.com/feed.atom"

environments:
  dev:
    contentTopic: "/nipsys/dpulse/1.0.0/test_dev/proto"
    feedContentTopic: "/nipsys/feed/1.0.0/test_dev/proto"
    logLevel: debug
  prod:
    contentTopic: "/nipsys/dpulse/1.0.0/test_prod/proto"
    feedContentTopic: "/nipsys/feed/1.0.0/test_prod/proto"
    logLevel: info

services:
  - name: test-web
    displayName: "Test Web"
    description: "Test web service"
    type: http
    url: https://example.com
    expect:
      status: 200

iconCids: {}
